name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installers (NSIS + MSI)
        run: npm run tauri:build

      - name: Collect installers
        id: collect
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle"
          $files = Get-ChildItem -Path "$dir/nsis/*.exe", "$dir/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $files) { throw "No installer artifacts found" }
          $files | ForEach-Object { Write-Host "artifact: $($_.FullName)" }
          "paths=$($files.FullName -join ';')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload to release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: ${{ steps.collect.outputs.paths }}
