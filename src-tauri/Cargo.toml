[package]
name = "app"
version = "0.1.0"
description = "Local-first AI workbench with a lossless prompt-compression engine"
authors = ["Onur Gultekin"]
license = "Apache-2.0"
repository = "https://github.com/onurgultekinn/thalamus-desktop"
homepage = "https://github.com/onurgultekinn/thalamus-desktop"
readme = "../README.md"
keywords = ["ai", "llm", "compression", "tauri", "desktop"]
categories = ["development-tools", "text-processing"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Masaustu hedefi: `main.rs` yalnizca `app_lib::run()` cagirir, rlib yeter.
# `staticlib`/`cdylib` Tauri'nin mobil sablonundan geliyordu; mobil hedef
# olmadigi icin iki gereksiz derleme artefakti uretiyordu.
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Native folder/file picker for the "open project" flow (src/components/Sidebar.tsx).
# Minor version MUST match @tauri-apps/plugin-dialog in package.json (Tauri CLI enforces it).
tauri-plugin-dialog = "~2.7.3"

# Thalamus local compression engine (pure Rust — no external crate/model)
tiktoken-rs = "0.5"

# Segment analizini cekirdeklere dagitmak icin (kayipsiz: yalnizca zamanlama degisir)
rayon = "1"
# Ince tokenizer katmani: lookahead'siz regex (tiktoken'in fancy_regex'ine gore
# ~3x hizli tarama) + public byte_pair_encode. Cikti tiktoken ile birebir ayni.
regex = "1"
base64 = "0.22"
# tiktoken'in cl100k deseni (lookahead'li) birebir ayni kullanilir.
fancy-regex = "0.12"
# tiktoken-rs'in rank tablosuyla ayni hasher (byte_pair_encode imzasi bunu ister).
rustc-hash = "1"

# Isletim sisteminin CSPRNG'si: yerel API oturum tokeni (backend/mod.rs).
getrandom = "0.3"

# HTTP backend — a local axum server for browser preview and desktop
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors"] }

# AI provider calls (Rust side — no CORS, the key never reaches the webview)
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "stream", "rustls-tls"] }
# SSE akışını axum yanıtına bağlamak için (stream::unfold)
futures-util = "0.3"

# Real PTY terminal (ConPTY on Windows) — ANSI + interactive programs
portable-pty = "0.8"

# To locate the app-data directory without opening the Tauri window (--serve-only)
dirs = "6"

# To write API keys into the Windows Credential Manager (secrets.rs FFI)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[dev-dependencies]
# For the HTTP router integration tests (CORS origin checks).
tower = { version = "0.5", features = ["util"] }

# Dev builds are unoptimized by default, which makes the local tokenizer and
# compression engine feel sluggish. Optimize dependencies even in dev, while
# keeping the app crate itself cheap to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

